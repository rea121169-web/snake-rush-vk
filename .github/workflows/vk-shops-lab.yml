name: VK Shops guest mobile smoke test
on:
  push:
    branches:
      - vk-shops-verifier-lab
    paths:
      - 'vk-shops-lab/**'
      - '.github/workflows/vk-shops-lab.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m py_compile vk-shops-lab/probe.py
      - name: Public guest mobile pages test
        run: python3 vk-shops-lab/probe.py
